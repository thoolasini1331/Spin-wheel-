<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OASIS RECOVERY — Spin the Wheel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="hero">
      <div class="hero-inner">
        <h1 class="title">OASIS RECOVERY</h1>
        <p class="subtitle">Spin the Wheel — A Journey of Possibilities</p>
      </div>
      <div id="musicToggle" class="music-toggle" title="Toggle background music" tabindex="0" role="button" aria-pressed="false">
        ♪
      </div>
    </header>

    <section class="container">
      <div class="left-panel">
        <div class="wheel-wrap">
          <canvas id="wheelCanvas" aria-label="Prize wheel" role="img"></canvas>
          <div id="pointer" aria-hidden="true">
            <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" class="pointer-svg">
              <polygon points="50,6 62,30 38,30" fill="#D4A72C" stroke="#a57f1b" stroke-width="1.5"/>
            </svg>
          </div>

          <button id="spinBtn" class="btn spin" aria-label="Spin">SPIN</button>
          <button id="spinAgainBtn" class="btn spin-again" aria-label="Spin again">SPIN AGAIN</button>
          <button id="resetBtn" class="btn reset" aria-label="Reset">RESET</button>
        </div>

        <div class="controls">
          <div class="audio-uploads">
            <label class="small">Upload background music (optional)
              <input type="file" id="bgUpload" accept="audio/*" aria-label="Upload background music">
            </label>
            <label class="small">Upload cheering audio (optional)
              <input type="file" id="cheerUpload" accept="audio/*" aria-label="Upload cheering audio">
            </label>
            <label class="small">Sound
              <input type="checkbox" id="soundToggle" checked aria-label="Sound on/off">
            </label>
          </div>

          <div class="fullscreen-row">
            <button id="fullscreenBtn" class="btn small" aria-label="Enter fullscreen">Fullscreen</button>
          </div>
        </div>
      </div>

      <aside class="right-panel" aria-label="Management panel">
        <section class="manage">
          <h2>Entries</h2>
          <form id="entryForm" aria-label="Add or edit entry">
            <input id="entryName" placeholder="Entry name" required aria-label="Entry name">
            <input id="entryURL" placeholder="https://example.com" type="url" aria-label="Entry URL">
            <input id="entryColor" type="color" value="#063D22" aria-label="Entry color">
            <div class="form-row">
              <button id="addEntryBtn" class="btn small" type="submit">Add / Save</button>
              <button id="restoreDefaultsBtn" class="btn small" type="button">Restore Defaults</button>
            </div>
          </form>

          <div id="entriesList" class="entries" aria-live="polite"></div>
        </section>

        <section class="history" aria-label="Previous winners">
          <h2>History</h2>
          <div id="historyList" class="history-list"></div>
          <button id="clearHistoryBtn" class="btn small" aria-label="Clear history">Clear history</button>
        </section>
      </aside>
    </section>

    <!-- Winner popup -->
    <div id="winnerModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-content" role="document">
        <h3 class="winner-title">CONGRATULATIONS!</h3>
        <p id="winnerName" class="winner-name"></p>
        <div class="winner-actions">
          <button id="openLinkBtn" class="btn" aria-label="Open selected link">OPEN SELECTED LINK</button>
          <button id="closeWinnerBtn" class="btn" aria-label="Close winner popup">Close</button>
        </div>
      </div>
    </div>

    <!-- Canvas overlay for confetti/fireworks -->
    <canvas id="effectsCanvas" class="effects-canvas" aria-hidden="true"></canvas>

    <footer class="footer">
      <small>Elegant spin wheel by Oasis Recovery — built with HTML5 Canvas, CSS3 & JavaScript — Times New Roman required</small>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
