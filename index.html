<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OASIS RECOVERY — Spin the Wheel</title>
  <style>
    :root{
      --deep-green: #063D22;
      --metallic-gold: #D4A72C;
      --cream: #F3E4C5;
      --off-white: #F7F5EF;
      --black: #000000;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: "Times New Roman", Times, serif;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(6,61,34,0.45), transparent),
                  radial-gradient(900px 500px at 90% 90%, rgba(6,61,34,0.2), transparent),
                  var(--deep-green);
      color: var(--off-white);
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:28px;
      min-height:100vh;
    }

    .container {
      width:100%;
      max-width:1200px;
      margin:24px auto;
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:28px;
      align-items:start;
    }

    /* Header / brand */
    header{
      grid-column: 1 / -1;
      text-align:center;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      flex-wrap:wrap;
      padding:8px 12px;
    }

    /* New brand layout */
    .brand-wrap{
      display:flex;
      align-items:center;
      gap:18px;
      justify-content:center;
      flex-wrap:nowrap;
    }
    .brand-logo{
      width:88px;
      height:auto;
      display:block;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
      flex-shrink:0;
    }
    .brand-text {
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      line-height:0.9;
    }
    .brand-name{
      margin:0;
      font-family: "Times New Roman", Times, serif;
      font-weight:700;
      font-style:italic;
      color: var(--cream);
      font-size: clamp(20px, 2.8vw, 36px);
      letter-spacing:1px;
      text-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 6px 18px rgba(2,2,2,0.6);
    }
    .brand-subname{
      font-family: "Times New Roman", Times, serif;
      font-weight:700;
      font-style:italic;
      color: var(--metallic-gold);
      font-size: clamp(12px, 1.1vw, 18px);
      margin-top:4px;
    }
    .brand-tagline{
      font-family: "Times New Roman", Times, serif;
      font-weight:700;
      font-style:italic;
      color: var(--off-white);
      font-size: 12px;
      margin-top:6px;
      opacity:0.95;
    }

    p.subtitle {
      width:100%;
      margin-top:6px;
      color: var(--off-white);
      font-weight:700;
      font-style:italic;
      margin-bottom:16px;
      text-align:center;
    }

    /* Left column contains the wheel and controls */
    .left {
      background: linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.06));
      padding:18px;
      border-radius:12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position:relative;
    }

    .wheel-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      width:100%;
    }

    /* Container for wheel with perspective */
    .wheel-container {
      width:100%;
      max-width:720px;
      aspect-ratio:1/1;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      margin:0 auto;
    }

    .wheel-outer {
      width:92%;
      height:92%;
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.05), transparent 6%),
        linear-gradient(180deg, #e7cf66, #b68616);
      box-shadow:
        inset 0 12px 30px rgba(255,255,255,0.07),
        inset 0 -18px 40px rgba(0,0,0,0.45),
        0 30px 80px rgba(0,0,0,0.6);
      position:absolute;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:5;
    }

    /* Rotating element */
    .wheel-spin {
      width:88%;
      height:88%;
      border-radius:50%;
      position:relative;
      transform-origin:center center;
      transition: transform 0.6s cubic-bezier(.1,.9,.2,1);
      will-change: transform;
      z-index:6;
      overflow:visible;
    }

    /* face uses conic-gradient dynamically set */
    .wheel-face {
      position:absolute;
      inset:6%;
      border-radius:50%;
      box-shadow:
        inset 0 20px 30px rgba(255,255,255,0.04),
        inset 0 -22px 40px rgba(0,0,0,0.45),
        0 18px 60px rgba(0,0,0,0.5);
      display:block;
      z-index:7;
    }

    /* Labels placed inside wheel. They rotate together with the wheel because they are children of .wheel-spin
       Use black text, Times New Roman Bold Italic, centered, allow wrap up to 2 lines, auto-fit font size via JS. */
    .segment-label {
      position:absolute;
      left:50%;
      top:50%;
      transform-origin: 50% 50%;
      font-family: "Times New Roman", Times, serif;
      font-weight:700;
      font-style:italic;
      color: var(--black);
      text-align:center;
      pointer-events:none;
      white-space:normal;
      word-break:break-word;
      line-height:1.02;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2px;
      z-index:10;
      box-sizing:border-box;
    }

    .hub {
      position:absolute;
      width:18%;
      height:18%;
      border-radius:50%;
      background: linear-gradient(180deg,#b98f2a,#5a3a0e);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--cream);
      font-weight:700;
      font-style:italic;
      font-size: clamp(12px, 1.6vw, 20px);
      text-align:center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.05);
      z-index:12;
    }

    /* fixed pointer at top */
    .pointer {
      position:absolute;
      top:6%;
      left:50%;
      transform:translateX(-50%);
      width:0;height:0;
      border-left:20px solid transparent;
      border-right:20px solid transparent;
      border-bottom:36px solid var(--metallic-gold);
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      transform-origin:center;
    }
    .pointer::after{
      content:"";
      position:absolute;
      top:-18px;
      left:-10px;
      width:20px;height:20px;
      background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0.7) 10%, #c79b1a 20%, #815e0e 70%);
      border-radius:50%;
      box-shadow: 0 0 12px rgba(212,167,44,0.95);
    }

    .controls {
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .btn {
      background: linear-gradient(180deg, #fff7d9, #d9b85a);
      color: var(--deep-green);
      border: 3px solid rgba(0,0,0,0.15);
      padding: 12px 18px;
      border-radius: 10px;
      font-weight:700;
      font-style:italic;
      cursor:pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    }
    .btn.secondary{
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.06));
      color: var(--off-white);
      border:1px solid rgba(255,255,255,0.06);
      box-shadow: none;
    }

    .announcement {
      margin-top:8px;
      text-align:center;
      padding:10px 14px;
      border-radius:8px;
      min-height:48px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-style:italic;
      color:var(--cream);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 10px 26px rgba(0,0,0,0.45);
    }

    /* Right column is entry manager and audio controls */
    .right {
      background: linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.06));
      padding:18px;
      border-radius:12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      height:fit-content;
    }
    .panel-title {
      font-size:18px;
      margin-bottom:8px;
      font-weight:700;
      font-style:italic;
    }
    label{font-size:13px;display:block;margin-top:8px;color:var(--off-white);opacity:0.95;font-weight:700;font-style:italic}
    input[type="text"], input[type="url"]{
      width:100%;
      padding:8px 10px;
      margin-top:6px;
      border-radius:8px;
      border:1px solid rgba(0,0,0,0.2);
      background:var(--off-white);
      color:var(--deep-green);
      font-family:"Times New Roman", Times, serif;
      font-weight:700;
      font-style:italic;
    }
    .entry-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; max-height:320px; overflow:auto; padding-right:6px }
    .entry-item{ display:flex; gap:8px; align-items:center; justify-content:space-between; background: rgba(255,255,255,0.03); padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.02) }
    .entry-item .meta{flex:1; overflow:hidden}
    .entry-item .meta b{ display:block; font-weight:700; font-style:italic; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .entry-item .meta small{ display:block; font-size:12px; opacity:0.85; color:var(--off-white) }
    .entry-item .actions{ display:flex; gap:6px; margin-left:8px; flex-shrink:0 }

    .file-row { display:flex; gap:8px; align-items:center; margin-top:8px; }

    .music-controls { display:flex; gap:8px; align-items:center; margin-top:12px; justify-content:space-between }

    /* popup overlay */
    .overlay {
      position: fixed;
      left:0; top:0; right:0; bottom:0;
      background: rgba(0,0,0,0.6);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:20px;
    }
    .popup {
      background: linear-gradient(180deg, var(--off-white), #fff5db);
      color: var(--deep-green);
      padding:26px;
      border-radius:12px;
      width: min(680px, 92%);
      box-shadow: 0 20px 80px rgba(0,0,0,0.7);
      text-align:center;
      font-family: "Times New Roman", Times, serif;
    }
    .popup h2{ margin-bottom:8px; font-style:italic; font-weight:700; font-size:28px }
    .popup p{ margin-bottom:14px; font-weight:700; font-style:italic; color: #2b4b33 }
    .popup .popup-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px }

    /* confetti canvas overlay */
    #confetti {
      position: fixed;
      pointer-events: none;
      left:0;top:0;right:0;bottom:0;
      z-index:9998;
    }

    @media (max-width:980px){
      .container{ grid-template-columns: 1fr; padding-bottom:48px; }
      .right{ order:2; margin-top:16px }
      .left{ order:1 }
      .wheel-container{ max-width:86vmin }
      .pointer{ border-left:16px solid transparent; border-right:16px solid transparent; border-bottom:30px solid var(--metallic-gold) }
      /* Stack brand nicely on small screens */
      header { flex-direction: column; gap:6px; padding-bottom:6px; }
      .brand-logo{ width:72px; }
      .brand-name{ font-size: clamp(18px, 5.4vw, 28px); }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="container" role="main">
    <header>
      <div class="brand-wrap" role="banner" aria-label="Oasis Recovery brand">
        <!-- Inline SVG logo (placed beside heading) -->
        <svg class="brand-logo" viewBox="0 0 700 700" aria-label="Oasis Recovery logo" role="img" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f5d877"/>
              <stop offset="30%" stop-color="#d4a72c"/>
              <stop offset="70%" stop-color="#c0961d"/>
              <stop offset="100%" stop-color="#f4d36d"/>
            </linearGradient>
          </defs>

          <!-- outer circular ring -->
          <circle cx="350" cy="350" r="250" fill="#f4f1ea" stroke="url(#goldGrad)" stroke-width="18"/>
          <path d="M70 320 Q350 500 630 320" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" opacity="0.85"/>

          <!-- leaves -->
          <g fill="#063D22" stroke="#063D22" stroke-width="2" transform="translate(0,15)">
            <path d="M115 235 C100 190, 130 170, 170 180 C145 210, 125 230, 115 235Z"/>
            <path d="M105 300 C88 260, 120 230, 170 238 C150 275, 120 295, 105 300Z"/>
            <path d="M515 255 C545 215, 590 205, 620 230 C585 255, 555 282, 515 255Z"/>
            <path d="M535 300 C560 255, 605 255, 635 290 C595 316, 560 322, 535 300Z"/>
          </g>

          <!-- hands -->
          <g fill="#063D22" stroke="#063D22" stroke-width="4" opacity="0.95">
            <path d="M150 440 C190 415, 220 420, 245 442 C255 450, 260 470, 248 484 C228 505, 193 522, 158 514 C134 509, 130 474, 150 440Z"/>
            <path d="M520 440 C490 412, 455 420, 430 442 C418 450, 412 470, 424 484 C444 505, 480 523, 513 514 C538 509, 545 475, 520 440Z"/>
          </g>

          <!-- psi-like inner mark -->
          <g transform="translate(350 350)">
            <path d="M0 -116
                     C-58 -116, -96 -75, -96 -32
                     C-96 12, -74 38, -28 48
                     L-20 128
                     L-48 128
                     L-52 162
                     L82 162
                     L78 128
                     L52 128
                     L40 48
                     C78 38, 96 9, 96 -32
                     C96 -75, 58 -116, 0 -116Z
                     M0 -82
                     C34 -82, 60 -60, 60 -26
                     C60 -6, 47 10, 22 18
                     L16 72
                     L-16 72
                     L-22 18
                     C-48 11, -60 -6, -60 -26
                     C-60 -60, -34 -82, 0 -82Z"
                  fill="url(#goldGrad)" />
          </g>

          <!-- bottom palms -->
          <g fill="#063D22" stroke="#063D22" stroke-width="4">
            <path d="M190 522 C215 555, 280 578, 350 580 C420 578, 485 557, 510 522 C508 560, 471 604, 350 628 C229 604, 192 560, 190 522Z"/>
          </g>
        </svg>

        <div class="brand-text">
          <h1 class="brand-name">OASIS</h1>
          <div class="brand-subname">RECOVERY</div>
          <div class="brand-tagline">RESTORE, RENEW, THRIVE</div>
        </div>
      </div>

      <p class="subtitle">Spin the Wheel — A Journey of Possibilities</p>
    </header>

    <section class="left" aria-labelledby="wheel-heading">
      <div class="wheel-area">
        <div class="wheel-container" aria-hidden="false">
          <div class="wheel-outer" aria-hidden="true"></div>

          <div class="wheel-spin" id="wheel" aria-live="off" aria-atomic="true">
            <div class="wheel-face" id="wheelFace" aria-hidden="true"></div>
            <!-- labels are injected dynamically inside .wheel-spin -->
            <div class="hub">OASIS</div>
          </div>

          <div class="pointer" aria-hidden="true"></div>
        </div>

        <div class="controls" role="group" aria-label="Wheel controls">
          <button id="spinBtn" class="btn" title="Spin the wheel now">SPIN NOW</button>
          <button id="spinAgainBtn" class="btn secondary" title="Spin again without resetting">SPIN AGAIN</button>
          <button id="resetBtn" class="btn secondary" title="Reset wheel and clear winner">RESET</button>
        </div>

        <div class="announcement" id="announcement" role="status" aria-live="polite">
          Ready to spin
        </div>
      </div>
    </section>

    <aside class="right" aria-labelledby="manage-heading">
      <div>
        <div class="panel-title" id="manage-heading">Manage Wheel Entries</div>

        <label for="entryName">Entry Name</label>
        <input id="entryName" type="text" placeholder="Person or Prize name" />

        <label for="entryUrl">Website URL (optional)</label>
        <input id="entryUrl" type="url" placeholder="https://example.org" />

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button id="addBtn" class="btn">ADD ENTRY</button>
          <button id="saveBtn" class="btn secondary">SAVE (to localStorage)</button>
        </div>

        <div class="entry-list" id="entryList" aria-live="polite" aria-atomic="true"></div>

        <hr style="border:none;height:1px;background:rgba(255,255,255,0.03);margin:12px 0">

        <div class="panel-title">Audio & Music</div>

        <div class="file-row">
          <label for="uploadMusic" style="margin:0">Upload MP3 (optional)</label>
          <input id="uploadMusic" type="file" accept="audio/*" />
        </div>

        <div style="display:flex; gap:8px; margin-top:8px; align-items:center">
          <button id="musicToggle" class="btn secondary">MUSIC: OFF</button>
          <div style="flex:1">
            <label for="volume" style="margin:0;font-size:12px">Volume</label>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.28" />
          </div>
        </div>

        <div style="margin-top:10px; font-size:13px; opacity:0.92">
          Music will start after you enable it (user interaction required by browsers).
        </div>

      </div>
    </aside>
  </div>

  <!-- Winner Popup placeholder -->
  <div id="winnerOverlay" class="overlay" style="display:none" aria-hidden="true">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <h2 id="popupTitle">CONGRATULATIONS!</h2>
      <p id="popupSelected">Selected: ---</p>
      <div class="popup-actions" id="popupActions">
        <button id="openLinkBtn" class="btn">OPEN SELECTED LINK</button>
        <button id="popupSpinAgain" class="btn secondary">SPIN AGAIN</button>
        <button id="closePopup" class="btn secondary">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    /* ========= DOM refs ========= */
    const wheel = document.getElementById('wheel');
    const wheelFace = document.getElementById('wheelFace');
    const spinBtn = document.getElementById('spinBtn');
    const spinAgainBtn = document.getElementById('spinAgainBtn');
    const resetBtn = document.getElementById('resetBtn');
    const announcement = document.getElementById('announcement');

    const entryNameInput = document.getElementById('entryName');
    const entryUrlInput = document.getElementById('entryUrl');
    const addBtn = document.getElementById('addBtn');
    const saveBtn = document.getElementById('saveBtn');
    const entryList = document.getElementById('entryList');

    const uploadMusic = document.getElementById('uploadMusic');
    const musicToggle = document.getElementById('musicToggle');
    const volumeSlider = document.getElementById('volume');

    const confettiCanvas = document.getElementById('confetti');

    const winnerOverlay = document.getElementById('winnerOverlay');
    const popupSelected = document.getElementById('popupSelected');
    const openLinkBtn = document.getElementById('openLinkBtn');
    const popupSpinAgain = document.getElementById('popupSpinAgain');
    const closePopup = document.getElementById('closePopup');

    /* ========= state & constants ========= */
    const STORAGE_KEY = 'oasis-wheel-entries-v1';
    const DEFAULT_ENTRIES = [
      {name:"Counselling", url:"https://example.org/counselling"},
      {name:"Detox Programme", url:"https://example.org/detox"},
      {name:"Group Therapy", url:"https://example.org/group"},
      {name:"Aftercare", url:"https://example.org/aftercare"},
      {name:"Family Support", url:"https://example.org/family"},
      {name:"Mindfulness", url:"https://example.org/mindfulness"}
    ];
    const PALETTE = ['#063D22','#D4A72C','#F3E4C5','#F7F5EF'];

    let entries = [];
    let selectedIndex = null;
    let winner = null;

    // Spin control (we implement exactly 20 seconds spin)
    const SPIN_DURATION = 20000; // ms (20 seconds)
    let spinStartTime = null;
    let spinStartAngle = 0;
    let spinTotalDegrees = 0;
    let spinning = false;
    let raf = null;
    let lastSegmentUnderPointer = null;

    // Audio
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let masterGain = null;
    let musicGain = null;
    let musicSource = null;
    let uploadedMusicBuffer = null;
    let tickBuffer = null;
    let applauseBuffer = null;

    // confetti
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiRunning = false;

    /* ========= localStorage ========= */
    function saveEntriesToStorage(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }
    function loadEntriesFromStorage(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          const parsed = JSON.parse(raw);
          if(Array.isArray(parsed) && parsed.length > 0){
            entries = parsed;
            return;
          }
        }
      }catch(e){}
      entries = DEFAULT_ENTRIES.slice();
      saveEntriesToStorage();
    }

    /* ========= wheel rendering & labels inside segments ========= */

    // Remove any old labels and build new ones inside .wheel-spin
    function renderWheel(){
      const n = Math.max(entries.length, 1);
      const slice = 360 / n;
      const stops = [];
      for(let i=0;i<n;i++){
        const color = PALETTE[i % PALETTE.length];
        const start = i*slice;
        const end = (i+1)*slice;
        stops.push(`${color} ${start}deg ${end}deg`);
      }
      wheelFace.style.background = `conic-gradient(${stops.join(',')})`;

      // remove old label nodes
      const old = wheel.querySelectorAll('.segment-label');
      old.forEach(e=>e.remove());

      // compute geometry
      const rect = wheel.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      // choose radial position: 65% of distance from center to outer edge (user wanted 60-70%)
      const radius = Math.min(centerX, centerY) * 0.65;

      for(let i=0;i<n;i++){
        const angleMid = (i * slice) + slice/2;
        // polar -> cartesian
        const theta = angleMid * Math.PI / 180;
        const x = centerX + Math.sin(theta) * radius;
        const y = centerY - Math.cos(theta) * radius;

        const label = document.createElement('div');
        label.className = 'segment-label';
        // Set content (allow 2 lines)
        label.innerText = entries[i] && entries[i].name ? entries[i].name : `Entry ${i+1}`;
        // position at x,y relative to wheel (percent)
        label.style.left = (x / rect.width * 100) + '%';
        label.style.top = (y / rect.height * 100) + '%';
        // width: approximate available arc chord length at that radius
        const sliceRad = slice * Math.PI / 180;
        const chord = 2 * radius * Math.sin(sliceRad/2);
        const labelWidth = Math.max( Math.min(chord * 0.9, rect.width * 0.45), 40 );
        label.style.width = Math.round(labelWidth) + 'px';
        // set a max height for two lines (approx)
        const maxLabelHeight = Math.round(parseFloat(window.getComputedStyle(label).fontSize || 16) * 2.6);
        label.style.maxHeight = Math.round(maxLabelHeight * 2) + 'px';
        // we do not rotate the label itself; because labels are children of .wheel-spin they rotate WITH the wheel automatically
        // center text within label via transform
        label.style.transform = 'translate(-50%,-50%)';
        // Styling specifics required
        label.style.color = '#000000';
        label.style.fontFamily = '"Times New Roman", Times, serif';
        label.style.fontWeight = '700';
        label.style.fontStyle = 'italic';
        label.style.textAlign = 'center';
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.justifyContent = 'center';
        label.style.lineHeight = '1.02';
        label.style.whiteSpace = 'normal';
        label.style.wordBreak = 'break-word';
        // Append then adjust font-size to fit up to two lines
        wheel.appendChild(label);
        fitLabelTextToBox(label, 2);
      }
    }

    // Adjust font-size so text fits within label area up to maxLines lines.
    function fitLabelTextToBox(label, maxLines){
      if(!label) return;
      const computed = window.getComputedStyle(label);
      // start with a size relative to wheel
      const rect = wheel.getBoundingClientRect();
      let fontSize = Math.min(18, Math.max(12, rect.width * 0.028));
      label.style.fontSize = fontSize + 'px';
      label.style.lineHeight = 1.02;
      // measure and reduce font-size until it fits within allowed height (approx)
      const maxHeight = maxLines * (fontSize * 1.05);
      // allow small loop to reduce size if overflow
      for(let i=0;i<10;i++){
        const h = label.scrollHeight;
        if(h > maxHeight && fontSize > 9){
          fontSize = Math.max(9, fontSize - 1);
          label.style.fontSize = fontSize + 'px';
        } else break;
      }
      // final clamp to ensure text does not overflow label width by using word-break
    }

    /* ========= audio utilities (tick & generated) ========= */
    function ensureAudioContext(){
      if(audioCtx) return;
      audioCtx = new AudioCtx();
      masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9;
      musicGain = audioCtx.createGain(); musicGain.gain.value = parseFloat(volumeSlider.value);
      musicGain.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      tickBuffer = createTickBuffer();
    }
    function createTickBuffer(){
      const ctx = audioCtx || (new (window.AudioContext || window.webkitAudioContext)());
      const len = Math.floor(ctx.sampleRate * 0.028); // ~28ms
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<len;i++){
        const t = i/ctx.sampleRate;
        // a high frequency click with decaying envelope + tiny noise
        data[i] = (Math.random()*2-1) * 0.008 + Math.sin(2*Math.PI*6000*t) * Math.exp(-80*t) * 0.6;
      }
      return buf;
    }
    function playTick(){
      if(!audioCtx) return;
      const src = audioCtx.createBufferSource();
      src.buffer = tickBuffer;
      const g = audioCtx.createGain(); g.gain.value = 0.95;
      src.connect(g); g.connect(masterGain);
      src.start();
    }

    /* ========= spin logic: controlled 20s easing ========= */

    // easing function - smooth fast start then slow (easeOutCubic)
    function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

    // compute which segment is under pointer given a wheel rotation angle (in degrees)
    function normalizeAngle(a){ return ((a % 360) + 360) % 360; }
    function sliceAngle(){ return 360 / Math.max(entries.length, 1); }

    // pointer is at top (0deg). When wheel is rotated by angle degrees clockwise,
    // the label index at pointer is computed as:
    function segmentAtPointer(angle){
      const a = normalizeAngle(angle);
      const slice = sliceAngle();
      // middle of segment i is at - (i*slice + slice/2) degrees rotation; rearrange:
      // adj = (360 - a + slice/2) mod 360; idx = floor(adj / slice)
      const adj = normalizeAngle(360 - a + slice/2);
      let idx = Math.floor(adj / slice);
      if(entries.length === 0) idx = 0;
      idx = idx % entries.length;
      return idx;
    }

    // Start spin: compute totalDegrees and animate over exactly SPIN_DURATION ms
    function startSpin(totalRotations /* optional overrides */){
      if(spinning) return; // prevent concurrent spins
      // prepare audio
      ensureAudioContext();
      if(audioCtx.state === 'suspended') audioCtx.resume();

      // set start state
      spinStartTime = performance.now();
      // current angle from transform
      const cur = getCurrentWheelAngle();
      spinStartAngle = cur;
      // choose random rotations if not provided
      const minRot = 8; // start fairly lively (8 rotations)
      const maxRot = 18; // up to 18 rotations - total degrees later multiplied
      const rotations = typeof totalRotations === 'number' ? totalRotations : (Math.random() * (maxRot - minRot) + minRot);
      // add a random extra offset for unpredictability
      const randOffset = Math.random() * 360;
      spinTotalDegrees = rotations * 360 + randOffset;
      // ensure positive direction chosen randomly
      if(Math.random() > 0.5) spinTotalDegrees *= -1;

      // controls
      spinning = true;
      lastSegmentUnderPointer = null;
      disableControlsDuringSpin(true);
      announcement.textContent = 'Spinning...';

      // start frame loop
      if(!raf) raf = requestAnimationFrame(spinFrame);
    }

    function getCurrentWheelAngle(){
      const st = window.getComputedStyle(wheel).transform;
      if(!st || st === 'none') return 0;
      // matrix(a,b,c,d,tx,ty) => angle = atan2(b,a) in radians
      const m = st.match(/^matrix\((.+)\)$/);
      if(m){
        const parts = m[1].split(',').map(s=>parseFloat(s));
        const a = parts[0], b = parts[1];
        const angle = Math.atan2(b,a) * 180 / Math.PI;
        return angle;
      }
      return 0;
    }

    function setWheelAngle(angle){
      wheel.style.transform = `rotate(${angle}deg)`;
    }

    function spinFrame(now){
      const elapsed = now - spinStartTime;
      const t = Math.min(1, elapsed / SPIN_DURATION);
      const eased = easeOutCubic(t);
      const currentAngle = spinStartAngle + spinTotalDegrees * eased;
      setWheelAngle(currentAngle);
      // tick per segment boundary crossing
      const seg = segmentAtPointer(currentAngle);
      if(lastSegmentUnderPointer === null) lastSegmentUnderPointer = seg;
      if(seg !== lastSegmentUnderPointer){
        playTick();
        lastSegmentUnderPointer = seg;
      }
      if(t >= 1){
        // end of spin exactly when elapsed >= SPIN_DURATION
        spinning = false;
        raf = null;
        handleSpinEnd(currentAngle);
        // re-enable controls
        disableControlsDuringSpin(false);
        return;
      }
      raf = requestAnimationFrame(spinFrame);
    }

    function disableControlsDuringSpin(flag){
      spinBtn.disabled = flag;
      spinAgainBtn.disabled = flag;
      resetBtn.disabled = flag;
      if(flag){
        spinBtn.setAttribute('aria-disabled','true');
        spinAgainBtn.setAttribute('aria-disabled','true');
        resetBtn.setAttribute('aria-disabled','true');
      } else {
        spinBtn.removeAttribute('aria-disabled');
        spinAgainBtn.removeAttribute('aria-disabled');
        resetBtn.removeAttribute('aria-disabled');
      }
    }

    function handleSpinEnd(finalAngle){
      // snap precisely to center of segment under pointer
      const idx = segmentAtPointer(finalAngle);
      selectedIndex = idx;
      const slice = sliceAngle();
      const targetAngle = normalizeAngle(360 - (idx * slice + slice/2));
      // compute smallest rotation difference
      const current = normalizeAngle(finalAngle);
      let diff = targetAngle - current;
      if(diff > 180) diff -= 360;
      if(diff < -180) diff += 360;
      const snapped = finalAngle + diff;
      // animate small snap for polish (200ms)
      wheel.style.transition = 'transform 300ms cubic-bezier(.2,.9,.25,1)';
      setWheelAngle(snapped);
      setTimeout(()=>{
        wheel.style.transition = '';
        // announce winner and show popup
        winner = entries[idx];
        showWinnerPopup(idx);
        // produce celebration and confetti etc (kept minimal here so as not to break)
        startConfetti();
        // play applause or jingle via audioCtx if present
        if(audioCtx) playApplauseOrJingle();
      }, 320);
    }

    /* ========= winner popup logic ========= */
    function showWinnerPopup(idx){
      const entry = entries[idx] || {name:`Entry ${idx+1}`, url: ''};
      popupSelected.textContent = `Selected: ${entry.name}`;
      if(entry.url && entry.url.trim()){
        openLinkBtn.style.display = '';
        openLinkBtn.onclick = ()=> { window.open(entry.url, '_blank'); };
      } else {
        openLinkBtn.style.display = 'none';
      }
      winnerOverlay.style.display = 'flex';
      winnerOverlay.setAttribute('aria-hidden','false');
    }
    function hideWinnerPopup(){
      winnerOverlay.style.display = 'none';
      winnerOverlay.setAttribute('aria-hidden','true');
    }

    popupSpinAgain.addEventListener('click', ()=>{
      hideWinnerPopup();
      // start a fresh 20s spin from current wheel angle
      startSpin();
    });
    closePopup.addEventListener('click', ()=> hideWinnerPopup());
    openLinkBtn.addEventListener('click', ()=> { /* handled by onclick set above */ });

    /* ========= entry management UI ========= */
    function renderEntryList(){
      entryList.innerHTML = '';
      entries.forEach((e, idx) => {
        const it = document.createElement('div');
        it.className = 'entry-item';
        const meta = document.createElement('div'); meta.className = 'meta';
        const b = document.createElement('b'); b.textContent = e.name || `Entry ${idx+1}`;
        const s = document.createElement('small'); s.textContent = e.url || '';
        meta.appendChild(b); meta.appendChild(s);
        const actions = document.createElement('div'); actions.className = 'actions';
        const edit = document.createElement('button');
        edit.className = 'btn secondary'; edit.textContent = 'EDIT';
        edit.addEventListener('click', ()=>{
          entryNameInput.value = e.name || '';
          entryUrlInput.value = e.url || '';
          addBtn.textContent = 'UPDATE ENTRY';
          addBtn.dataset.editIndex = idx;
          window.scrollTo({top:0, behavior:'smooth'});
        });
        const del = document.createElement('button');
        del.className = 'btn secondary'; del.textContent = 'DELETE';
        del.addEventListener('click', ()=>{
          if(!confirm('Delete entry "' + (e.name || '...') + '"?')) return;
          entries.splice(idx,1);
          saveEntriesToStorage();
          renderEntryList();
          renderWheel();
        });
        actions.appendChild(edit); actions.appendChild(del);
        it.appendChild(meta); it.appendChild(actions);
        entryList.appendChild(it);
      });
    }

    addBtn.addEventListener('click', ()=>{
      const name = entryNameInput.value.trim();
      const url = entryUrlInput.value.trim();
      if(!name){ alert('Entry name required.'); return; }
      if(addBtn.dataset.editIndex !== undefined){
        const idx = parseInt(addBtn.dataset.editIndex, 10);
        if(!isNaN(idx) && idx >= 0 && idx < entries.length){
          entries[idx].name = name;
          entries[idx].url = url || '';
        }
        addBtn.textContent = 'ADD ENTRY';
        delete addBtn.dataset.editIndex;
      } else {
        entries.push({name, url: url || ''});
      }
      entryNameInput.value = ''; entryUrlInput.value = '';
      saveEntriesToStorage();
      renderEntryList();
      renderWheel();
    });

    saveBtn.addEventListener('click', ()=>{ saveEntriesToStorage(); alert('Entries saved to localStorage.'); });

    /* ========= music upload / toggle ========= */
    uploadMusic.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      ensureAudioContext();
      const data = await file.arrayBuffer();
      try{
        uploadedMusicBuffer = await audioCtx.decodeAudioData(data.slice(0));
        alert('Music uploaded and ready. Toggle MUSIC ON to play it.');
      }catch(err){ console.warn(err); alert('Failed to decode uploaded music.'); }
    });

    musicToggle.addEventListener('click', async ()=>{
      ensureAudioContext();
      if(audioCtx.state === 'suspended') await audioCtx.resume();
      if(musicSource || uploadedMusicBuffer){
        // toggle existing music off
        stopMusic();
        musicToggle.textContent = 'MUSIC: OFF';
      } else {
        // start music (uploaded or simple generated)
        if(uploadedMusicBuffer){
          musicSource = audioCtx.createBufferSource();
          musicSource.buffer = uploadedMusicBuffer;
          musicSource.loop = true;
          musicSource.connect(musicGain);
          musicSource.start();
        } else {
          startGeneratedMusic();
        }
        musicToggle.textContent = 'MUSIC: ON';
      }
    });

    function stopMusic(){
      if(musicSource){
        try{ musicSource.stop(); }catch(e){}
        musicSource.disconnect();
        musicSource = null;
      }
      stopGeneratedMusic();
      musicToggle.textContent = 'MUSIC: OFF';
    }

    // generated ambient music (fallback)
    let padOsc1=null, padOsc2=null, padGain=null;
    function startGeneratedMusic(){
      if(!audioCtx) return;
      padGain = audioCtx.createGain(); padGain.gain.value = 0;
      padGain.connect(musicGain);
      padOsc1 = audioCtx.createOscillator(); padOsc2 = audioCtx.createOscillator();
      padOsc1.type = 'sine'; padOsc2.type = 'sine';
      padOsc1.frequency.value = 220; padOsc2.frequency.value = 330;
      padOsc1.connect(padGain); padOsc2.connect(padGain);
      padOsc1.start(); padOsc2.start();
      padGain.gain.linearRampToValueAtTime(parseFloat(volumeSlider.value) * 0.6, audioCtx.currentTime + 1.2);
    }
    function stopGeneratedMusic(){
      if(padGain){
        padGain.gain.cancelScheduledValues(audioCtx.currentTime);
        padGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
        setTimeout(()=>{ try{ padOsc1.stop(); padOsc2.stop(); }catch(e){}; padOsc1=padOsc2=padGain=null; }, 900);
      }
    }

    volumeSlider.addEventListener('input', ()=>{
      if(!audioCtx) return;
      if(musicGain) musicGain.gain.value = parseFloat(volumeSlider.value);
    });

    /* ========= tick + applause ======== */
    function playApplauseOrJingle(){
      if(!audioCtx) return;
      if(applauseBuffer){
        const src = audioCtx.createBufferSource();
        src.buffer = applauseBuffer;
        const g = audioCtx.createGain(); g.gain.value = 0.9;
        src.connect(g); g.connect(masterGain);
        src.start();
      } else {
        // small generated applause-like burst + jingle
        // quick noise bursts
        const now = audioCtx.currentTime;
        for(let i=0;i<6;i++){
          const len = audioCtx.sampleRate * 0.12;
          const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const ch = buf.getChannelData(0);
          for(let j=0;j<ch.length;j++) ch[j] = (Math.random()*2-1) * Math.exp(-6*j/ch.length) * 0.25;
          const s = audioCtx.createBufferSource();
          s.buffer = buf;
          const g = audioCtx.createGain(); g.gain.value = 0.15 * (1 - i/10);
          s.connect(g); g.connect(masterGain);
          s.start(now + i * 0.06);
        }
      }
    }

    /* ========= confetti (kept same as prior) ========= */
    function resizeConfetti(){ confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function startConfetti(){
      confettiRunning = true; confettiParticles = [];
      for(let i=0;i<140;i++){
        confettiParticles.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * -confettiCanvas.height,
          vx: (Math.random()-0.5)*8,
          vy: Math.random()*6 + 2,
          size: Math.random()*8 + 6,
          color: PALETTE[Math.floor(Math.random()*PALETTE.length)],
          rot: Math.random()*360,
          vr: (Math.random()-0.5)*10
        });
      }
      requestAnimationFrame(confettiLoop);
      setTimeout(()=>stopConfetti(), 9000);
    }
    function stopConfetti(){ confettiRunning = false; }
    function confettiLoop(){
      confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
      for(let i=confettiParticles.length-1;i>=0;i--){
        const p = confettiParticles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vr;
        confettiCtx.save();
        confettiCtx.translate(p.x,p.y);
        confettiCtx.rotate(p.rot * Math.PI/180);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
        confettiCtx.restore();
        if(p.y > confettiCanvas.height + 60) confettiParticles.splice(i,1);
      }
      if(confettiRunning){
        if(Math.random() < 0.25){
          confettiParticles.push({
            x: Math.random() * confettiCanvas.width,
            y: -10,
            vx: (Math.random()-0.5)*6,
            vy: Math.random()*4 + 2,
            size: Math.random()*8 + 6,
            color: PALETTE[Math.floor(Math.random()*PALETTE.length)],
            rot: Math.random()*360,
            vr: (Math.random()-0.5)*10
          });
        }
      }
      if(confettiParticles.length > 0) requestAnimationFrame(confettiLoop);
    }

    /* ========= gestures for fling/drag (optional) ========= */
    (function addDragAndFling(){
      let down = false, sx=0, sy=0, st=0, startAngle=0;
      wheel.addEventListener('pointerdown', (e)=>{
        if(spinning) return;
        down = true; sx = e.clientX; sy = e.clientY; st = performance.now();
        startAngle = getCurrentWheelAngle();
        wheel.setPointerCapture(e.pointerId);
      });
      window.addEventListener('pointermove', (e)=>{
        if(!down) return;
        const dx = e.clientX - sx;
        // small drag rotates wheel
        const newAngle = startAngle + dx * 0.35;
        setWheelAngle(newAngle);
      });
      window.addEventListener('pointerup', (e)=>{
        if(!down) return;
        down = false;
        const dt = (performance.now() - st) / 1000;
        const dx = e.clientX - sx;
        const vx = dx / Math.max(dt, 0.01) * 2.0;
        if(Math.abs(vx) > 600){
          // treat as fling: convert to totalDegrees to complete in SPIN_DURATION
          // map vx to rotations
          const rotations = Math.min(30, Math.max(6, Math.abs(vx) / 200));
          let totalDeg = rotations * 360 + Math.random()*360;
          if(vx < 0) totalDeg *= -1;
          // start a controlled 20s spin with this many rotations
          // set spinTotalDegrees accordingly
          spinStartTime = performance.now();
          spinStartAngle = getCurrentWheelAngle();
          spinTotalDegrees = totalDeg;
          spinning = true;
          lastSegmentUnderPointer = null;
          disableControlsDuringSpin(true);
          announcement.textContent = 'Spinning...';
          if(!raf) raf = requestAnimationFrame(spinFrame);
        }
      });
    })();

    /* ========= initialization & helpers ========= */
    function init(){
      loadEntriesFromStorage();
      renderEntryList();
      renderWheel();
      // set up click to initialize audio context on first user interaction
      document.addEventListener('click', ()=>{ if(!audioCtx) try{ ensureAudioContext(); }catch(e){} }, {once:true});
      // ensure tickBuffer available if audio created
      if(audioCtx) tickBuffer = createTickBuffer();
      // attach control buttons
      spinBtn.addEventListener('click', ()=> startSpin());
      spinAgainBtn.addEventListener('click', ()=>{
        if(spinning) return;
        startSpin();
      });
      resetBtn.addEventListener('click', ()=>{
        // stop spin
        spinning = false;
        if(raf){ cancelAnimationFrame(raf); raf = null; }
        wheel.style.transition = 'transform 600ms cubic-bezier(.2,.9,.25,1)';
        setWheelAngle(0);
        spinStartAngle = 0;
        spinTotalDegrees = 0;
        spinStartTime = null;
        winner = null;
        selectedIndex = null;
        announcement.textContent = 'Ready to spin';
        hideWinnerPopup();
        disableControlsDuringSpin(false);
        setTimeout(()=> wheel.style.transition = '', 620);
      });
      // popup close handlers already bound
      // ensure labels update on resize
      window.addEventListener('resize', ()=> { renderWheel(); });
    }

    // Utility: return computed wheel angle (same as getCurrentWheelAngle above)
    // (kept for clarity)
    // init audio tick buffer lazily
    init();

    // Ensure labels update whenever entries change due to outside calls:
    // (already done in add/delete/save flows)
    // Expose renderWheel to be callable from console if needed
    window.renderWheel = renderWheel;

  })();
  </script>
</body>
</html>
