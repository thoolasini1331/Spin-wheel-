<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OASIS RECOVERY — Spin the Wheel</title>
  <style>
    :root{
      --deep-green: #063D22;
      --metallic-gold: #D4A72C;
      --cream: #F3E4C5;
      --off-white: #F7F5EF;
      --glass: rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: "Times New Roman", Times, serif;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(6,61,34,0.45), transparent),
                  radial-gradient(900px 500px at 90% 90%, rgba(6,61,34,0.2), transparent),
                  var(--deep-green);
      color: var(--off-white);
      -webkit-font-smoothing:antialiased;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:28px;
      min-height:100vh;
    }

    .container {
      width:100%;
      max-width:1200px;
      margin:24px auto;
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:28px;
      align-items:start;
    }

    header{
      grid-column: 1 / -1;
      text-align:center;
      margin-bottom:8px;
    }
    h1 {
      font-size: clamp(22px, 3.4vw, 36px);
      color: var(--cream);
      font-weight:700;
      font-style:italic;
      letter-spacing:1px;
      margin-bottom:6px;
      text-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 6px 18px rgba(2,2,2,0.6);
    }
    p.subtitle {
      color: var(--off-white);
      font-weight:700;
      font-style:italic;
      margin-bottom:16px;
    }

    /* Left column contains the wheel and controls */
    .left {
      background: linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.06));
      padding:18px;
      border-radius:12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      position:relative;
    }

    .wheel-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      width:100%;
    }

    /* Container for wheel with perspective */
    .wheel-container {
      width:100%;
      max-width:720px;
      aspect-ratio:1/1;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      margin:0 auto;
    }

    .wheel-outer {
      width:92%;
      height:92%;
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.05), transparent 6%),
        linear-gradient(180deg, #e7cf66, #b68616);
      box-shadow:
        inset 0 12px 30px rgba(255,255,255,0.07),
        inset 0 -18px 40px rgba(0,0,0,0.45),
        0 30px 80px rgba(0,0,0,0.6);
      position:absolute;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:5;
    }

    /* Rotating element */
    .wheel-spin {
      width:88%;
      height:88%;
      border-radius:50%;
      position:relative;
      transform-origin:center center;
      transition: transform 0.6s cubic-bezier(.1,.9,.2,1);
      will-change: transform;
      z-index:6;
      overflow:visible;
    }

    /* face uses conic-gradient dynamically set */
    .wheel-face {
      position:absolute;
      inset:6%;
      border-radius:50%;
      box-shadow:
        inset 0 20px 30px rgba(255,255,255,0.04),
        inset 0 -22px 40px rgba(0,0,0,0.45),
        0 18px 60px rgba(0,0,0,0.5);
      display:block;
      z-index:7;
    }

    .segment-label {
      position:absolute;
      left:50%;
      top:50%;
      transform-origin: 0 0;
      font-weight:700;
      font-style:italic;
      font-size: clamp(11px, 1.6vw, 18px);
      color: var(--off-white);
      text-shadow: 0 2px 0 rgba(0,0,0,0.6);
      pointer-events:none;
      white-space:nowrap;
      text-align:center;
      padding:2px 6px;
      z-index:10;
    }

    .hub {
      position:absolute;
      width:18%;
      height:18%;
      border-radius:50%;
      background: linear-gradient(180deg,#b98f2a,#5a3a0e);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--cream);
      font-weight:700;
      font-style:italic;
      font-size: clamp(12px, 1.6vw, 20px);
      text-align:center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.6), inset 0 4px 10px rgba(255,255,255,0.05);
      z-index:12;
    }

    /* fixed pointer at top */
    .pointer {
      position:absolute;
      top:6%;
      left:50%;
      transform:translateX(-50%);
      width:0;height:0;
      border-left:20px solid transparent;
      border-right:20px solid transparent;
      border-bottom:36px solid var(--metallic-gold);
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      transform-origin:center;
    }
    .pointer::after{
      content:"";
      position:absolute;
      top:-18px;
      left:-10px;
      width:20px;height:20px;
      background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0.7) 10%, #c79b1a 20%, #815e0e 70%);
      border-radius:50%;
      box-shadow: 0 0 12px rgba(212,167,44,0.95);
    }

    .controls {
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .btn {
      background: linear-gradient(180deg, #fff7d9, #d9b85a);
      color: var(--deep-green);
      border: 3px solid rgba(0,0,0,0.15);
      padding: 12px 18px;
      border-radius: 10px;
      font-weight:700;
      font-style:italic;
      cursor:pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    }
    .btn.secondary{
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.06));
      color: var(--off-white);
      border:1px solid rgba(255,255,255,0.06);
      box-shadow: none;
    }

    .announcement {
      margin-top:8px;
      text-align:center;
      padding:10px 14px;
      border-radius:8px;
      min-height:48px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-style:italic;
      color:var(--cream);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 10px 26px rgba(0,0,0,0.45);
    }

    /* Right column is entry manager and audio controls */
    .right {
      background: linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.06));
      padding:18px;
      border-radius:12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      height:fit-content;
    }
    .panel-title {
      font-size:18px;
      margin-bottom:8px;
      font-weight:700;
      font-style:italic;
    }
    label{font-size:13px;display:block;margin-top:8px;color:var(--off-white);opacity:0.95;font-weight:700;font-style:italic}
    input[type="text"], input[type="url"]{
      width:100%;
      padding:8px 10px;
      margin-top:6px;
      border-radius:8px;
      border:1px solid rgba(0,0,0,0.2);
      background:var(--off-white);
      color:var(--deep-green);
      font-family:"Times New Roman", Times, serif;
      font-weight:700;
      font-style:italic;
    }
    .entry-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; max-height:320px; overflow:auto; padding-right:6px }
    .entry-item{ display:flex; gap:8px; align-items:center; justify-content:space-between; background: rgba(255,255,255,0.03); padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.02) }
    .entry-item .meta{flex:1; overflow:hidden}
    .entry-item .meta b{ display:block; font-weight:700; font-style:italic; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .entry-item .meta small{ display:block; font-size:12px; opacity:0.85; color:var(--off-white) }
    .entry-item .actions{ display:flex; gap:6px; margin-left:8px; flex-shrink:0 }

    .file-row { display:flex; gap:8px; align-items:center; margin-top:8px; }

    .music-controls { display:flex; gap:8px; align-items:center; margin-top:12px; justify-content:space-between }

    /* confetti canvas overlay */
    #confetti {
      position: fixed;
      pointer-events: none;
      left:0;top:0;right:0;bottom:0;
      z-index:9999;
    }

    @media (max-width:980px){
      .container{ grid-template-columns: 1fr; padding-bottom:48px; }
      .right{ order:2; margin-top:16px }
      .left{ order:1 }
      .wheel-container{ max-width:86vmin }
      .pointer{ border-left:16px solid transparent; border-right:16px solid transparent; border-bottom:30px solid var(--metallic-gold) }
    }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="container" role="main">
    <header>
      <h1>OASIS RECOVERY</h1>
      <p class="subtitle">Spin the Wheel — A Journey of Possibilities</p>
    </header>

    <section class="left" aria-labelledby="wheel-heading">
      <div class="wheel-area">
        <div class="wheel-container" aria-hidden="false">
          <div class="wheel-outer" aria-hidden="true"></div>

          <div class="wheel-spin" id="wheel" aria-live="off" aria-atomic="true">
            <div class="wheel-face" id="wheelFace" aria-hidden="true"></div>
            <!-- labels are injected dynamically -->
            <div class="hub">OASIS</div>
          </div>

          <div class="pointer" aria-hidden="true"></div>
        </div>

        <div class="controls" role="group" aria-label="Wheel controls">
          <button id="spinBtn" class="btn" title="Spin the wheel now">SPIN NOW</button>
          <button id="spinAgainBtn" class="btn secondary" title="Spin again without resetting">SPIN AGAIN</button>
          <button id="resetBtn" class="btn secondary" title="Reset wheel and clear winner">RESET</button>
        </div>

        <div class="announcement" id="announcement" role="status" aria-live="polite">
          Ready to spin
        </div>
      </div>
    </section>

    <aside class="right" aria-labelledby="manage-heading">
      <div>
        <div class="panel-title" id="manage-heading">Manage Wheel Entries</div>

        <label for="entryName">Entry Name</label>
        <input id="entryName" type="text" placeholder="Person or Prize name" />

        <label for="entryUrl">Website URL (optional)</label>
        <input id="entryUrl" type="url" placeholder="https://example.org" />

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button id="addBtn" class="btn">ADD ENTRY</button>
          <button id="saveBtn" class="btn secondary">SAVE (to localStorage)</button>
        </div>

        <div class="entry-list" id="entryList" aria-live="polite" aria-atomic="true"></div>

        <hr style="border:none;height:1px;background:rgba(255,255,255,0.03);margin:12px 0">

        <div class="panel-title">Audio & Music</div>

        <div class="file-row">
          <label for="uploadMusic" style="margin:0">Upload MP3 (optional)</label>
          <input id="uploadMusic" type="file" accept="audio/*" />
        </div>

        <div style="display:flex; gap:8px; margin-top:8px; align-items:center">
          <button id="musicToggle" class="btn secondary">MUSIC: OFF</button>
          <div style="flex:1">
            <label for="volume" style="margin:0;font-size:12px">Volume</label>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.28" />
          </div>
        </div>

        <div style="margin-top:10px; font-size:13px; opacity:0.92">
          Music will start after you enable it (user interaction required by browsers).
        </div>

      </div>
    </aside>
  </div>

  <script>
  (function(){
    // Constants & DOM refs
    const wheel = document.getElementById('wheel');
    const wheelFace = document.getElementById('wheelFace');
    const spinBtn = document.getElementById('spinBtn');
    const spinAgainBtn = document.getElementById('spinAgainBtn');
    const resetBtn = document.getElementById('resetBtn');
    const announcement = document.getElementById('announcement');

    const entryNameInput = document.getElementById('entryName');
    const entryUrlInput = document.getElementById('entryUrl');
    const addBtn = document.getElementById('addBtn');
    const saveBtn = document.getElementById('saveBtn');
    const entryList = document.getElementById('entryList');

    const uploadMusic = document.getElementById('uploadMusic');
    const musicToggle = document.getElementById('musicToggle');
    const volumeSlider = document.getElementById('volume');

    const confettiCanvas = document.getElementById('confetti');
    const confettiCtx = confettiCanvas.getContext('2d');

    // Localstorage key
    const STORAGE_KEY = 'oasis-wheel-entries-v1';

    // Default sample entries (six)
    const DEFAULT_ENTRIES = [
      {name:"Counselling", url:"https://example.org/counselling"},
      {name:"Detox Programme", url:"https://example.org/detox"},
      {name:"Group Therapy", url:"https://example.org/group"},
      {name:"Aftercare", url:"https://example.org/aftercare"},
      {name:"Family Support", url:"https://example.org/family"},
      {name:"Mindfulness", url:"https://example.org/mindfulness"}
    ];

    // Colors to alternate: deep green, metallic gold, cream, off-white
    const PALETTE = ['#063D22','#D4A72C','#F3E4C5','#F7F5EF'];

    // Application state
    let entries = []; // array of {name, url}
    let selectedIndex = null;
    let winner = null;

    // Wheel physics state
    let angular = 0; // degrees
    let velocity = 0; // deg/sec
    let spinning = false;
    let lastTime = null;
    let rafId = null;
    let lastSegmentUnderPointer = null;

    // Audio context and sources
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let masterGain = null;
    let musicGain = null;
    let musicSource = null;
    let uploadedMusicBuffer = null;
    let musicOn = false;

    // Short buffers for tick & applause
    let tickBuffer = null;
    let applauseBuffer = null; // optional uploaded applause from file
    let jinglePlaying = false;

    // Confetti state
    let confettiParticles = [];
    let confettiRunning = false;

    // Utility functions
    function saveEntriesToStorage(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }
    function loadEntriesFromStorage(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          entries = JSON.parse(raw);
          if(!Array.isArray(entries) || entries.length === 0){
            entries = DEFAULT_ENTRIES.slice();
            saveEntriesToStorage();
          }
        } else {
          entries = DEFAULT_ENTRIES.slice();
          saveEntriesToStorage();
        }
      }catch(e){
        entries = DEFAULT_ENTRIES.slice();
      }
    }

    // Build wheel visual using conic-gradient and create labels
    function renderWheel(){
      const n = entries.length || 1;
      const slice = 360 / n;
      // build gradient stops using palette cycling
      const stops = [];
      for(let i=0;i<n;i++){
        const color = PALETTE[i % PALETTE.length];
        const start = i*slice;
        const end = (i+1)*slice;
        stops.push(`${color} ${start}deg ${end}deg`);
      }
      wheelFace.style.background = `conic-gradient(${stops.join(',')})`;
      // remove existing labels
      const oldLabels = wheel.querySelectorAll('.segment-label');
      oldLabels.forEach(l=>l.remove());
      // create labels positioned around center, inside wheel-spin so they rotate with wheel
      const rect = wheel.getBoundingClientRect();
      const radius = Math.min(rect.width, rect.height) * 0.36;
      for(let i=0;i<n;i++){
        const angle = i*slice;
        const label = document.createElement('div');
        label.className = 'segment-label';
        label.textContent = entries[i] ? entries[i].name : `Entry ${i+1}`;
        // Position label at radial position and rotate so it follows the wheel (we intentionally keep text rotated with wheel)
        // We'll offset so the label sits roughly centered along segment radius.
        const theta = (angle + slice/2) * Math.PI/180; // middle of segment
        const x = 50 + Math.sin(theta) * (radius/ (rect.width/2) * 100);
        const y = 50 - Math.cos(theta) * (radius/ (rect.height/2) * 100);
        label.style.left = x + '%';
        label.style.top = y + '%';
        // Rotate label to point outward along segment (labels rotate together with wheel)
        label.style.transform = `translate(-50%,-50%) rotate(${angle + slice/2}deg)`;
        label.style.fontWeight = '700';
        label.style.fontStyle = 'italic';
        label.style.fontFamily = '"Times New Roman", Times, serif';
        wheel.appendChild(label);
      }
    }

    // Re-render list UI
    function renderEntryList(){
      entryList.innerHTML = '';
      entries.forEach((e, idx) => {
        const it = document.createElement('div');
        it.className = 'entry-item';
        const meta = document.createElement('div');
        meta.className = 'meta';
        const b = document.createElement('b');
        b.textContent = e.name || `Entry ${idx+1}`;
        const s = document.createElement('small');
        s.textContent = e.url || '';
        meta.appendChild(b);
        meta.appendChild(s);
        const actions = document.createElement('div');
        actions.className = 'actions';
        const edit = document.createElement('button');
        edit.className = 'btn secondary';
        edit.textContent = 'EDIT';
        edit.title = 'Edit this entry';
        edit.addEventListener('click', ()=> {
          entryNameInput.value = e.name;
          entryUrlInput.value = e.url || '';
          addBtn.textContent = 'UPDATE ENTRY';
          addBtn.dataset.editIndex = idx;
          window.scrollTo({top:0, behavior:'smooth'});
        });
        const del = document.createElement('button');
        del.className = 'btn secondary';
        del.textContent = 'DELETE';
        del.title = 'Delete this entry';
        del.addEventListener('click', ()=>{
          if(!confirm('Delete entry "' + e.name + '"?')) return;
          entries.splice(idx,1);
          saveEntriesToStorage();
          renderEntryList();
          renderWheel();
        });
        actions.appendChild(edit);
        actions.appendChild(del);
        it.appendChild(meta);
        it.appendChild(actions);
        entryList.appendChild(it);
      });
    }

    // Event handlers for add/save
    addBtn.addEventListener('click', ()=>{
      const name = entryNameInput.value.trim();
      const url = entryUrlInput.value.trim();
      if(!name){
        alert('Entry name required.');
        return;
      }
      const editIndex = addBtn.dataset.editIndex;
      if(editIndex !== undefined && editIndex !== null){
        const idx = parseInt(editIndex,10);
        if(!isNaN(idx) && idx >= 0 && idx < entries.length){
          entries[idx].name = name;
          entries[idx].url = url || '';
          addBtn.textContent = 'ADD ENTRY';
          delete addBtn.dataset.editIndex;
        }
      } else {
        entries.push({name, url: url || ''});
      }
      entryNameInput.value = '';
      entryUrlInput.value = '';
      saveEntriesToStorage();
      renderEntryList();
      renderWheel();
    });

    saveBtn.addEventListener('click', ()=>{
      saveEntriesToStorage();
      alert('Entries saved to localStorage.');
    });

    // Wheel geometry helpers
    function sliceAngle(){ return 360 / Math.max(entries.length, 1); }

    function normalizeAngle(a){
      return ((a % 360) + 360) % 360;
    }

    // Determine which segment index is at pointer (pointer at 0deg top)
    function segmentAtPointer(angle){
      // wheel rotated by "angle" degrees clockwise (positive). A label with index i is centered
      // at rotation angle = - (i*slice + slice/2) so compute mapping.
      const a = normalizeAngle(angle);
      const slice = sliceAngle();
      // The segment whose central angle aligns with top (0deg) when wheel angle = target
      // Compute "pointerAlignedIndex" as:
      // pointer sees segment index = Math.floor( ( (360 - a + slice/2) % 360 ) / slice )
      const adj = normalizeAngle(360 - a + slice/2);
      let idx = Math.floor(adj / slice);
      idx = idx % entries.length;
      return idx;
    }

    // AUDIO: initialize audio context when first needed
    function ensureAudioContext(){
      if(!audioCtx){
        audioCtx = new AudioCtx();
        masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9;
        musicGain = audioCtx.createGain(); musicGain.gain.value = parseFloat(volumeSlider.value);
        masterGain.connect(audioCtx.destination);
        musicGain.connect(masterGain);
        // create tick buffer
        tickBuffer = createTickBuffer();
      }
    }

    // Create a short tick "tak" buffer (click-like)
    function createTickBuffer(){
      const ctx = audioCtx || (new (window.AudioContext || window.webkitAudioContext)());
      const len = Math.floor(ctx.sampleRate * 0.03); // 30ms
      const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      // generate short click: decaying high-frequency sine + noise burst
      for(let i=0;i<len;i++){
        const t = i/ctx.sampleRate;
        // decaying sine
        data[i] = (Math.random()*2-1) * 0.02 + Math.sin(2*Math.PI*4000*t) * Math.exp(-40*t) * 0.5;
      }
      return buffer;
    }

    // Play tick sound
    function playTick(){
      if(!audioCtx) return;
      const src = audioCtx.createBufferSource();
      src.buffer = tickBuffer;
      const g = audioCtx.createGain();
      g.gain.value = 0.9;
      src.connect(g); g.connect(masterGain);
      src.start();
    }

    // Create victory jingle (generated) - short
    function playVictoryJingle(){
      if(!audioCtx) return;
      if(jinglePlaying) return;
      jinglePlaying = true;
      const now = audioCtx.currentTime;
      const master = masterGain;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc1.type = 'sine'; osc2.type = 'triangle';
      osc1.frequency.value = 660;
      osc2.frequency.value = 990;
      g.gain.value = 0;
      osc1.connect(g); osc2.connect(g); g.connect(master);

      osc1.start();
      osc2.start();

      // sequence of notes using setTimeout with scheduling
      const notes = [660, 880, 990, 1320];
      let t = 0;
      notes.forEach((freq, i) => {
        setTimeout(()=>{
          osc1.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.01);
          osc2.frequency.setTargetAtTime(freq*1.5, audioCtx.currentTime, 0.01);
          g.gain.cancelScheduledValues(audioCtx.currentTime);
          g.gain.setValueAtTime(0, audioCtx.currentTime);
          g.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        }, t);
        t += 400;
      });

      // stop after sequence
      setTimeout(()=>{
        osc1.stop();
        osc2.stop();
        jinglePlaying = false;
      }, t + 300);
    }

    // Play applause or generated crowd noise (simple)
    function playApplauseOrJingle(){
      if(!audioCtx) return;
      if(applauseBuffer){
        const src = audioCtx.createBufferSource();
        src.buffer = applauseBuffer;
        const g = audioCtx.createGain(); g.gain.value = 0.9;
        src.connect(g); g.connect(masterGain);
        src.start();
      } else {
        // generate short synthesized clap-like sound using noise bursts
        const now = audioCtx.currentTime;
        for(let i=0;i<6;i++){
          const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.12, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for(let j=0;j<data.length;j++){
            // decaying noise
            data[j] = (Math.random()*2-1) * Math.exp(-6 * j / data.length);
          }
          const src = audioCtx.createBufferSource();
          src.buffer = buffer;
          const g = audioCtx.createGain();
          g.gain.value = 0.15 * (1 - i/8);
          src.connect(g); g.connect(masterGain);
          src.start(now + i * 0.05);
        }
        // short jingle too
        setTimeout(()=>playVictoryJingle(), 150);
      }
    }

    // Music: simple ambient pad using oscillators (fallback if no uploaded file)
    let padOsc1, padOsc2, padGain;
    function startGeneratedMusic(){
      if(!audioCtx) return;
      if(musicSource) return; // a source is playing (uploaded)
      // ambient pad
      padGain = audioCtx.createGain(); padGain.gain.value = 0;
      padGain.connect(musicGain);
      padOsc1 = audioCtx.createOscillator();
      padOsc2 = audioCtx.createOscillator();
      padOsc1.type = 'sine'; padOsc2.type = 'sine';
      padOsc1.frequency.value = 220; padOsc2.frequency.value = 330;
      const padDetune = audioCtx.createGain(); padDetune.gain.value = 0;
      padOsc1.connect(padGain);
      padOsc2.connect(padGain);
      padOsc1.start();
      padOsc2.start();
      // smooth fade in
      padGain.gain.linearRampToValueAtTime(parseFloat(volumeSlider.value) * 0.6, audioCtx.currentTime + 1.2);
    }
    function stopGeneratedMusic(){
      if(padGain){
        padGain.gain.cancelScheduledValues(audioCtx.currentTime);
        padGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
        setTimeout(()=>{
          try{ padOsc1.stop(); padOsc2.stop(); }catch(e){}
          padOsc1 = padOsc2 = padGain = null;
        }, 1000);
      }
    }

    // Load uploaded music into buffer
    uploadMusic.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      ensureAudioContext();
      const data = await file.arrayBuffer();
      try{
        uploadedMusicBuffer = await audioCtx.decodeAudioData(data.slice(0));
        alert('Music uploaded and ready. Toggle MUSIC ON to play it.');
      }catch(err){
        console.error('Failed to decode music', err);
        alert('Could not decode the uploaded file.');
      }
    });

    // Music toggle
    musicToggle.addEventListener('click', async ()=>{
      ensureAudioContext();
      if(!musicOn){
        // start audio context on user interaction
        if(audioCtx.state === 'suspended') await audioCtx.resume();
        if(uploadedMusicBuffer){
          musicSource = audioCtx.createBufferSource();
          musicSource.buffer = uploadedMusicBuffer;
          musicSource.loop = true;
          musicSource.connect(musicGain);
          musicSource.start();
        } else {
          startGeneratedMusic();
        }
        musicOn = true;
        musicToggle.textContent = 'MUSIC: ON';
      } else {
        // stop
        musicOn = false;
        musicToggle.textContent = 'MUSIC: OFF';
        if(musicSource){
          try{ musicSource.stop(); }catch(e){}
          musicSource.disconnect();
          musicSource = null;
        }
        stopGeneratedMusic();
      }
    });

    volumeSlider.addEventListener('input', ()=>{
      if(!audioCtx) return;
      if(musicGain) musicGain.gain.value = parseFloat(volumeSlider.value);
    });

    // Tick when wheel passes segment boundary
    function checkTick(){
      const idx = segmentAtPointer(angular);
      if(lastSegmentUnderPointer === null) lastSegmentUnderPointer = idx;
      if(idx !== lastSegmentUnderPointer){
        // play mechanical tick
        ensureAudioContext();
        if(audioCtx) playTick();
        lastSegmentUnderPointer = idx;
      }
    }

    // Spin physics loop
    function step(ts){
      if(!lastTime) lastTime = ts;
      const dt = (ts - lastTime) / 1000;
      lastTime = ts;
      if(spinning){
        // integrate: apply velocity to angular
        angular += velocity * dt;
        // friction
        const friction = Math.pow(0.9985, dt * 60);
        velocity *= friction;
        // damp tiny velocities
        if(Math.abs(velocity) < 4) velocity *= 0.995;
        // render
        wheel.style.transform = `rotate(${angular}deg)`;
        // tick logic
        checkTick();
        // stop condition
        if(Math.abs(velocity) < 0.12){
          spinning = false;
          velocity = 0;
          finalizeSpin();
        }
      }
      rafId = requestAnimationFrame(step);
    }

    function finalizeSpin(){
      // Snap to center of segment
      const idx = segmentAtPointer(angular);
      selectedIndex = idx;
      const slice = sliceAngle();
      const target = normalizeAngle(360 - (idx * slice + slice/2));
      // compute small difference and animate wheel to final
      const diff = normalizeAngle(target - normalizeAngle(angular));
      let snap = diff;
      if(snap > 180) snap -= 360;
      angular = angular + snap;
      wheel.style.transition = 'transform 800ms cubic-bezier(.2,.9,.25,1)';
      wheel.style.transform = `rotate(${angular}deg)`;
      setTimeout(()=>{
        wheel.style.transition = '';
        announceWinner(idx);
        lastSegmentUnderPointer = null;
      }, 820);
    }

    function announceWinner(idx){
      winner = entries[idx];
      const name = winner && winner.name ? winner.name : `Entry ${idx+1}`;
      announcement.innerHTML = `<div style="font-size:18px;font-weight:700;font-style:italic">CONGRATULATIONS!</div><div style="margin-top:6px">${name}</div>`;
      // celebration
      startConfetti();
      ensureAudioContext();
      // play applause or jingle
      playApplauseOrJingle();
      // show open link button inside announcement
      if(winner && winner.url){
        const openBtn = document.createElement('button');
        openBtn.className = 'btn';
        openBtn.style.marginTop = '8px';
        openBtn.textContent = 'OPEN SELECTED LINK';
        openBtn.addEventListener('click', ()=> {
          window.open(winner.url, '_blank');
        });
        announcement.appendChild(openBtn);
      }
    }

    // Public control handlers
    function startSpin(initialVelocity){
      if(entries.length < 1) return;
      if(spinning) return;
      ensureAudioContext();
      // random spin: choose rotations and duration
      const rotations = (Math.random() * 6) + 6; // 6-12 rotations
      const spinTime = (Math.random() * 1.5) + 2.5; // seconds typical
      // initial angular velocity deg/sec
      velocity = (rotations * 360) / spinTime;
      // random direction
      if(Math.random() > 0.5) velocity *= -1;
      // override if provided
      if(typeof initialVelocity === 'number') velocity = initialVelocity;
      spinning = true;
      lastTime = null;
      // update UI
      announcement.textContent = 'Spinning...';
      spinBtn.disabled = true;
      spinAgainBtn.disabled = true;
      resetBtn.disabled = true;
      // ensure music unlocked on interaction
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    spinBtn.addEventListener('click', ()=>{
      startSpin();
      // start raf loop if not running
      if(!rafId) rafId = requestAnimationFrame(step);
    });

    spinAgainBtn.addEventListener('click', ()=>{
      // allow spin again: start from current angular and spin anew
      if(spinning) return;
      // small random push
      const extra = (Math.random() * 400 + 800) * (Math.random()>0.5 ? 1 : -1);
      startSpin(extra);
    });

    resetBtn.addEventListener('click', ()=>{
      spinning = false;
      velocity = 0;
      winner = null;
      selectedIndex = null;
      announcement.textContent = 'Ready to spin';
      wheel.style.transition = 'transform 700ms cubic-bezier(.2,.9,.25,1)';
      angular = 0;
      wheel.style.transform = `rotate(0deg)`;
      setTimeout(()=> wheel.style.transition = '', 760);
      stopConfetti();
      spinBtn.disabled = false;
      spinAgainBtn.disabled = false;
      resetBtn.disabled = false;
    });

    // TICK when user drags/flings wheel using mouse/touch
    (function addFlingAndDrag(){
      let down = false, startY=0, startX=0, startTime=0;
      let startAngleAtDown = 0;

      wheel.addEventListener('pointerdown', (e)=>{
        if(spinning) return;
        down = true;
        startX = e.clientX; startY = e.clientY; startTime = Date.now();
        startAngleAtDown = angular;
        wheel.setPointerCapture(e.pointerId);
      });
      window.addEventListener('pointermove', (e)=>{
        if(!down) return;
        // rotate wheel based on horizontal movement
        const dx = e.clientX - startX;
        angular = startAngleAtDown + dx * 0.4;
        wheel.style.transform = `rotate(${angular}deg)`;
        // ticks:
        checkTick();
      });
      window.addEventListener('pointerup', (e)=>{
        if(!down) return;
        down = false;
        const dt = (Date.now() - startTime) / 1000;
        const dx = e.clientX - startX;
        // fling velocity
        const flingV = dx / Math.max(dt, 0.01) * 2.2; // tuned
        if(Math.abs(flingV) > 150){
          velocity = flingV;
          spinning = true;
          lastTime = null;
          if(!rafId) rafId = requestAnimationFrame(step);
        }
      });
    })();

    // CONFETTI routines (canvas)
    function resizeConfetti(){
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function startConfetti(){
      confettiRunning = true;
      confettiParticles = [];
      for(let i=0;i<120;i++){
        confettiParticles.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * -confettiCanvas.height * Math.random(),
          vx: (Math.random() - 0.5) * 6,
          vy: Math.random() * 6 + 2,
          size: Math.random() * 8 + 6,
          color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
          rot: Math.random() * 360,
          vr: (Math.random() - 0.5) * 10
        });
      }
      requestAnimationFrame(confettiLoop);
      // also trigger small golden fireworks
      setTimeout(()=>fireworksBurst(), 200);
      // auto stop after some time
      setTimeout(()=>stopConfetti(), 9000);
    }

    function stopConfetti(){
      confettiRunning = false;
    }

    function confettiLoop(){
      confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
      if(!confettiRunning && confettiParticles.length===0) return;
      for(let i=confettiParticles.length-1;i>=0;i--){
        const p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.rot += p.vr;
        confettiCtx.save();
        confettiCtx.translate(p.x,p.y);
        confettiCtx.rotate(p.rot * Math.PI/180);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
        confettiCtx.restore();
        if(p.y > confettiCanvas.height + 60){
          confettiParticles.splice(i,1);
        }
      }
      if(confettiRunning){
        // spawn a few more
        if(Math.random() < 0.25){
          confettiParticles.push({
            x: Math.random() * confettiCanvas.width,
            y: -10,
            vx: (Math.random() - 0.5) * 6,
            vy: Math.random() * 4 + 2,
            size: Math.random() * 8 + 6,
            color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
            rot: Math.random() * 360,
            vr: (Math.random() - 0.5) * 10
          });
        }
      }
      if(confettiParticles.length > 0) requestAnimationFrame(confettiLoop);
    }

    function fireworksBurst(){
      // simple radial particle burst near top of wheel
      const cx = window.innerWidth/2;
      const cy = document.querySelector('.wheel-container').getBoundingClientRect().top + 120;
      const count = 40;
      for(let i=0;i<count;i++){
        confettiParticles.push({
          x: cx,
          y: cy,
          vx: Math.cos(i/count * Math.PI*2) * (Math.random()*8 + 2),
          vy: Math.sin(i/count * Math.PI*2) * (Math.random()*8 + 2),
          size: Math.random() * 6 + 3,
          color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
          rot: Math.random() * 360,
          vr: (Math.random() - 0.5) * 10
        });
      }
      requestAnimationFrame(confettiLoop);
    }

    // Initial load
    function init(){
      loadEntriesFromStorage();
      renderEntryList();
      renderWheel();
      // start RAF loop
      rafId = requestAnimationFrame(step);
      // create audio context on first click on page or first audio action
      document.addEventListener('click', ()=>{ if(!audioCtx) { try{ ensureAudioContext(); }catch(e){} } }, {once:true});
      // allow keyboard spin: space or enter when focused on spinBtn
      spinBtn.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spinBtn.click(); }});
      // ensure tickBuffer is ready after audio is created
      if(audioCtx) tickBuffer = createTickBuffer();

      // ensure labels reposition on resize
      window.addEventListener('resize', ()=> {
        renderWheel();
      });

      // If there are no entries (user deleted all) add placeholders
      if(entries.length === 0){
        entries = DEFAULT_ENTRIES.slice();
        saveEntriesToStorage();
      }
    }

    // Attempt to load optional applause file if user drags a file into page header
    window.addEventListener('dragover', (e)=> e.preventDefault());
    window.addEventListener('drop', async (e)=> {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if(!file) return;
      if(!file.type.startsWith('audio/')) return;
      ensureAudioContext();
      const data = await file.arrayBuffer();
      try{
        applauseBuffer = await audioCtx.decodeAudioData(data.slice(0));
        alert('Applause audio uploaded and will play on winner.');
      }catch(err){
        console.warn('Applause decode failed', err);
        alert('Could not decode dropped audio.');
      }
    });

    // Start
    init();

    // Accessibility: announce winner via aria-live label already used

  })();
  </script>
</body>
</html>
